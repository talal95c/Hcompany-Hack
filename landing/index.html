<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" />
    <meta
      name="description"
      content="Un petit ordinateur rétro. Cliquez sur l’écran pour entrer et ouvrir Google."
    />
    <title>CRT — Click to enter</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/crt/poster.png" as="image" />

  <body>
    <div id="root"></div>

        href="https://www.google.com/"

          class="fallback-cue"
          >Click</span
        ></a
      ></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
