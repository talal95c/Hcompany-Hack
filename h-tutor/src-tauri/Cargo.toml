[package]
name = "h-tutor"
version = "0.1.0"
description = "Live software tutor powered by H Company Holo"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "h_tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
reqwest = { version = "0.13", features = ["json", "multipart"] }
dotenvy = "0.15"
ptts = { version = "0.6", features = ["hf", "hub"] }
cpal = "0.18"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = "0.3"
whatlang = "0.18"
tokio = { version = "1", features = ["sync", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
ptts = { version = "0.6", features = ["accelerate"] }


# Dependencies (TTS inference, image encoding) are far too slow unoptimized.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
