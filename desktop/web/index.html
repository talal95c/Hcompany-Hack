<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guide Blender</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="guide" aria-hidden="true">
      <div id="zone" hidden></div>
      <div id="pointer" hidden><svg viewBox="0 0 36 44"><path d="M3 2 L3 34 L12 26 L19 41 L26 37 L19 23 L32 23 Z"/></svg></div>
      <div id="success" hidden><span>✓</span><strong id="success-text"></strong></div>
    </div>
    <main id="pill" hidden>
      <header><span id="connection" class="dot"></span><strong>Guide Blender</strong><span id="status">Connexion…</span><button id="expand" aria-expanded="false" title="Options et permissions">⋯</button></header>
      <p id="instruction" role="status">Prêt à vous accompagner.</p>
      <p id="transcript" aria-live="polite"></p>
      <nav><button id="mic">Maintenir pour parler</button><button id="stop" class="stop">Arrêter</button></nav>
      <section id="panel" hidden>
        <p class="muted" id="shortcuts"></p>
        <fieldset><legend>Autorisations natives</legend><div id="permissions"></div></fieldset>
        <form id="capture"><fieldset><legend>Partager une région (pixels physiques)</legend><div class="coordinates">
          <label>X<input name="x" type="number" value="100" required></label><label>Y<input name="y" type="number" value="160" required></label>
          <label>Largeur<input name="width" type="number" min="1" max="2048" value="500" required></label><label>Hauteur<input name="height" type="number" min="1" max="2048" value="320" required></label>
        </div><button type="submit">Capturer et partager cette zone</button></fieldset></form>
        <label class="consent"><input type="checkbox" id="consent">J'autorise le contrôle de Blender pendant 60 s.</label>
        <button id="delegate" disabled>Fais-le</button>
        <form id="question"><input id="text" maxlength="4096" placeholder="Une question…" aria-label="Question au moteur" required><button>Envoyer</button></form>
        <p id="error" role="alert"></p>
        <button id="dismiss-error" hidden>Effacer l'erreur</button>
        <footer><button id="restart">Redémarrer le moteur</button><button id="quit">Quitter</button></footer>
      </section>
    </main>
    <script src="app.js" defer></script>
  </body>
</html>
