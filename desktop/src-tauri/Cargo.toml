[package]
name = "hcompany-desktop"
version = "0.1.0"
description = "Client desktop de leçons Blender"
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "io-util"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
enigo = { version = "0.3", default-features = false, features = ["x11rb"] }
cpal = "0.16"

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25.1"
windows = { version = "0.62", features = ["Win32_UI_Accessibility", "Win32_System_Com"] }
xcap = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "0.30", features = ["zbus", "tokio"] }
gtk = "0.18"
x11rb = { version = "0.13", features = ["randr"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
