<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 940" width="1500" height="940" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#262626"/></marker></defs>
<rect width="1500" height="940" fill="#F7F6F3"/>
<text x="40" y="50" font-size="26" font-weight="700" fill="#262626">Architecture v3 : rien de lent sur le chemin critique</text>
<text x="40" y="78" font-size="14" fill="#5a5a5a">Tout ce qui est prévisible est calculé à la préparation. Tous les services IA sont dans le cloud. Chemin critique : add-on + notre code + Gladia + Jev. Holo pointe en avance.</text>
<g font-size="12" fill="#5a5a5a"><rect x="40" y="92" width="14" height="14" rx="3" fill="#FFFDBD" stroke="#262626"/><text x="60" y="104">partenaire IA</text><line x1="160" y1="99" x2="200" y2="99" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/><text x="208" y="104">chemin critique</text><line x1="330" y1="99" x2="370" y2="99" stroke="#262626" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="378" y="104">secours / en avance / asynchrone</text><text x="620" y="104">« est. » = à mesurer au J1</text></g>
<rect x="30" y="125" width="900" height="520" rx="16" fill="#EFEDE8" stroke="#262626" stroke-width="1.2" stroke-dasharray="2 0"/>
<text x="48" y="151" font-size="12" font-weight="700" letter-spacing="1.5" fill="#262626">MAC DE L&#x27;UTILISATEUR · UN SEUL PROCESSUS PYTHON + ADD-ON + OVERLAY</text>
<rect x="960" y="125" width="510" height="520" rx="16" fill="#EFEDE8" stroke="#262626" stroke-width="1.2" stroke-dasharray="2 0"/>
<text x="978" y="151" font-size="12" font-weight="700" letter-spacing="1.5" fill="#262626">SERVICES IA (CLOUD)</text>
<rect x="30" y="670" width="1440" height="250" rx="16" fill="#EFEDE8" stroke="#262626" stroke-width="1.2" stroke-dasharray="2 0"/>
<text x="48" y="696" font-size="12" font-weight="700" letter-spacing="1.5" fill="#262626">PRÉPARATION (RESTEP) · &lt; 1 MIN POUR UN TUTO CONNU, ~2 MIN POUR UN NOUVEAU (EST.)</text>
<rect x="55" y="160" width="320" height="215" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="67" y="181" font-size="14" font-weight="700" fill="#262626">Blender 5.x + add-on « Œil »</text>
<text x="67" y="200" font-size="11.5" fill="#3a3a3a">capteurs poussés : msgbus, depsgraph,</text>
<text x="67" y="216" font-size="11.5" fill="#3a3a3a">   operators lu toutes les 100 ms</text>
<text x="67" y="232" font-size="11.5" fill="#3a3a3a">rectangles des zones de l&#x27;écran (pour</text>
<text x="67" y="248" font-size="11.5" fill="#3a3a3a">   recadrer la capture)</text>
<text x="67" y="264" font-size="11.5" fill="#3a3a3a">② surligne dans Blender (draw_handler)</text>
<text x="67" y="280" font-size="11.5" fill="#3a3a3a">   + ouvre le menu (wm.call_menu)</text>
<text x="67" y="296" font-size="11.5" fill="#3a3a3a">relecture bpy (secours de « fais-le »)</text>
<rect x="55" y="390" width="320" height="80" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="67" y="411" font-size="14" font-weight="700" fill="#262626">Overlay Electron « bête »</text>
<text x="67" y="430" font-size="11.5" fill="#3a3a3a">pointeur · pastille · ✓ · pas de logique</text>
<text x="67" y="446" font-size="11.5" fill="#3a3a3a">échelle Retina = scaleFactor</text>
<rect x="55" y="485" width="320" height="60" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="67" y="506" font-size="14" font-weight="700" fill="#262626">Micro / haut-parleur</text>
<text x="67" y="525" font-size="11.5" fill="#3a3a3a">parler en maintenant une touche · audio en cache</text>
<rect x="55" y="560" width="320" height="75" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="67" y="581" font-size="14" font-weight="700" fill="#262626">Capture d&#x27;écran recadrée</text>
<text x="67" y="600" font-size="11.5" fill="#3a3a3a">seulement la zone utile (rectangle donné</text>
<text x="67" y="616" font-size="11.5" fill="#3a3a3a">par l&#x27;add-on) · prise en avance</text>
<rect x="445" y="160" width="460" height="475" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="457" y="181" font-size="14" font-weight="700" fill="#262626">Orchestrateur (asyncio)</text>
<text x="457" y="200" font-size="12.5" fill="#3a3a3a">• leçon prouvée = machine à états</text>
<text x="457" y="216" font-size="12.5" fill="#3a3a3a">• tests locaux sur l&#x27;état de Blender (&lt; 10 ms)</text>
<text x="457" y="232" font-size="12.5" fill="#3a3a3a">• politique d&#x27;aide : paliers ①→④, seuils,</text>
<text x="457" y="248" font-size="12.5" fill="#3a3a3a">   pause min. de 30 s, « chut »</text>
<text x="457" y="264" font-size="12.5" fill="#3a3a3a">• mémoire de compétences (répétition espacée)</text>
<text x="457" y="280" font-size="12.5" fill="#3a3a3a">   → palier de départ par compétence</text>
<text x="457" y="296" font-size="12.5" fill="#3a3a3a">• cache audio : consignes, « pourquoi », relances</text>
<text x="457" y="312" font-size="12.5" fill="#3a3a3a">• cache des cibles (version × zone × échelle UI)</text>
<text x="457" y="328" font-size="12.5" fill="#3a3a3a">• Holo localise la cible N+1 pendant l&#x27;étape N</text>
<text x="457" y="344" font-size="12.5" fill="#3a3a3a">• Jev lancé dès le partiel Gladia (spéculatif)</text>
<text x="457" y="360" font-size="12.5" fill="#3a3a3a">• mode dégradé : Jev &gt; 800 ms → une règle prend</text>
<text x="457" y="376" font-size="12.5" fill="#3a3a3a">   le relais ; sans Gladia → clavier ;</text>
<text x="457" y="392" font-size="12.5" fill="#3a3a3a">   sans LLM → réponse en cache</text>
<text x="457" y="408" font-size="12.5" fill="#3a3a3a"></text>
<text x="457" y="424" font-size="12.5" fill="#3a3a3a">Parle seulement si : erreur à corriger,</text>
<text x="457" y="440" font-size="12.5" fill="#3a3a3a">20 s sans progrès, ou 3 annulations</text>
<rect x="985" y="160" width="460" height="100" rx="10" fill="#FFFDBD" stroke="#262626" stroke-width="1.4"/>
<text x="997" y="181" font-size="14" font-weight="700" fill="#262626">Gladia live</text>
<text x="997" y="200" font-size="11.5" fill="#3a3a3a">transcriptions partielles + endpointing court</text>
<text x="997" y="216" font-size="11.5" fill="#3a3a3a">vocabulaire de l&#x27;interface Blender (Tore, Subdivision…)</text>
<rect x="985" y="280" width="460" height="110" rx="10" fill="#FFFDBD" stroke="#262626" stroke-width="1.4"/>
<text x="997" y="301" font-size="14" font-weight="700" fill="#262626">Jev (TypeSafe)</text>
<text x="997" y="320" font-size="11.5" fill="#3a3a3a">connexion persistante (évite ~200 ms de TCP)</text>
<text x="997" y="336" font-size="11.5" fill="#3a3a3a">lot : bloqué ? · quel palier ? · validation sans test</text>
<text x="997" y="352" font-size="11.5" fill="#3a3a3a">seule dans son appel : l&#x27;intention de la phrase</text>
<rect x="985" y="410" width="460" height="95" rx="10" fill="#FFFDBD" stroke="#262626" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="997" y="431" font-size="14" font-weight="700" fill="#262626">Holo4 35B-A3B · API H</text>
<text x="997" y="450" font-size="11.5" fill="#3a3a3a">localise la cible de l&#x27;étape N+1 en avance (cache)</text>
<text x="997" y="466" font-size="11.5" fill="#3a3a3a">agent_loop « fais-le » avec la leçon (4 actions)</text>
<rect x="985" y="525" width="460" height="100" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="997" y="546" font-size="14" font-weight="700" fill="#262626">LLM + TTS (streaming)</text>
<text x="997" y="565" font-size="11.5" fill="#3a3a3a">seulement pour les questions hors script</text>
<text x="997" y="581" font-size="11.5" fill="#3a3a3a">phrase d&#x27;attente en cache pendant 1,5 à 3 s (est.)</text>
<line x1="375" y1="215" x2="445" y2="215" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<text x="410" y="207" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">événements</text>
<line x1="445" y1="250" x2="375" y2="250" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<text x="410" y="266" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">surligne</text>
<line x1="445" y1="430" x2="375" y2="430" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<text x="410" y="422" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">(x, y)</text>
<line x1="375" y1="515" x2="445" y2="515" stroke="#262626" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="410" y="507" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">audio</text>
<line x1="375" y1="598" x2="445" y2="598" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<text x="410" y="590" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">image</text>
<text x="410" y="190" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="700">≤ 100 ms</text>
<line x1="905" y1="205" x2="985" y2="205" stroke="#262626" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="945" y="197" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">audio⇄texte</text>
<text x="945" y="226" font-size="10" text-anchor="middle" fill="#5a5a5a">~0,3 s (est.)</text>
<line x1="905" y1="335" x2="985" y2="335" stroke="#262626" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="945" y="327" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">état ⇄ P</text>
<text x="945" y="356" font-size="10" text-anchor="middle" fill="#5a5a5a">~0,2–0,5 s</text>
<line x1="905" y1="457" x2="985" y2="457" stroke="#262626" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="945" y="449" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">en avance</text>
<line x1="905" y1="575" x2="985" y2="575" stroke="#262626" stroke-width="1.5" stroke-dasharray="5 4" marker-start="url(#ar)" marker-end="url(#ar)"/>
<text x="945" y="567" font-size="10.5" text-anchor="middle" fill="#262626" font-weight="600">⇄ audio</text>
<rect x="55" y="725" width="180" height="115" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="67" y="746" font-size="14" font-weight="700" fill="#262626">Source</text>
<text x="67" y="765" font-size="11.5" fill="#3a3a3a">vidéo YouTube, doc,</text>
<text x="67" y="781" font-size="11.5" fill="#3a3a3a">ou démo enregistrée</text>
<line x1="235" y1="782" x2="255" y2="782" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<rect x="255" y="725" width="180" height="115" rx="10" fill="#FFFDBD" stroke="#262626" stroke-width="1.4"/>
<text x="267" y="746" font-size="14" font-weight="700" fill="#262626">Gladia (fichier)</text>
<text x="267" y="765" font-size="11.5" fill="#3a3a3a">Solaria-3 · horodatage</text>
<text x="267" y="781" font-size="11.5" fill="#3a3a3a">au mot · traduction</text>
<line x1="435" y1="782" x2="455" y2="782" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<rect x="455" y="725" width="180" height="115" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="467" y="746" font-size="14" font-weight="700" fill="#262626">Compilateur LLM</text>
<text x="467" y="765" font-size="11.5" fill="#3a3a3a">choisit parmi ~15 tests</text>
<text x="467" y="781" font-size="11.5" fill="#3a3a3a">écrit les « pourquoi »</text>
<text x="467" y="797" font-size="11.5" fill="#3a3a3a">génère l&#x27;audio</text>
<line x1="635" y1="782" x2="655" y2="782" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<rect x="655" y="725" width="180" height="115" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="667" y="746" font-size="14" font-weight="700" fill="#262626">Différence</text>
<text x="667" y="765" font-size="11.5" fill="#3a3a3a">mémoire ReStep :</text>
<text x="667" y="781" font-size="11.5" fill="#3a3a3a">quelles étapes ont</text>
<text x="667" y="797" font-size="11.5" fill="#3a3a3a">changé de version ?</text>
<line x1="835" y1="782" x2="855" y2="782" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<rect x="855" y="725" width="180" height="115" rx="10" fill="#FFFDBD" stroke="#262626" stroke-width="1.4"/>
<text x="867" y="746" font-size="14" font-weight="700" fill="#262626">Preuve</text>
<text x="867" y="765" font-size="11.5" fill="#3a3a3a">inchangé → bpy (ms)</text>
<text x="867" y="781" font-size="11.5" fill="#3a3a3a">changé → Holo sandbox</text>
<text x="867" y="797" font-size="11.5" fill="#3a3a3a">Linkup si bloqué</text>
<text x="867" y="813" font-size="11.5" fill="#3a3a3a">Devin en async (PR)</text>
<line x1="1035" y1="782" x2="1055" y2="782" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1055" y="725" width="180" height="115" rx="10" fill="#fff" stroke="#262626" stroke-width="1.4"/>
<text x="1067" y="746" font-size="14" font-weight="700" fill="#262626">Leçon prouvée</text>
<text x="1067" y="765" font-size="11.5" fill="#3a3a3a">étapes + tests</text>
<text x="1067" y="781" font-size="11.5" fill="#3a3a3a">+ audio + description</text>
<text x="1067" y="797" font-size="11.5" fill="#3a3a3a">de chaque cible</text>
<line x1="1235" y1="782" x2="1255" y2="782" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<rect x="1255" y="725" width="180" height="115" rx="10" fill="#FFFDBD" stroke="#262626" stroke-width="1.4"/>
<text x="1267" y="746" font-size="14" font-weight="700" fill="#262626">Face Agent</text>
<text x="1267" y="765" font-size="11.5" fill="#3a3a3a">H Skill par version</text>
<text x="1267" y="781" font-size="11.5" fill="#3a3a3a">restep_mcp → tout agent</text>
<text x="55" y="875" font-size="12" fill="#3a3a3a">La preuve par différence : on ne rejoue avec Holo que le chemin d'interface qui a changé depuis la version du tuto. Le cache des cibles est partagé : un tuto déjà suivi pointe instantanément.</text>
<text x="55" y="895" font-size="12" fill="#3a3a3a">Devin écrit les tests manquants et répare la doc en asynchrone : jamais sur le chemin de l'utilisateur.</text>
<polyline points="1145.0,725 1145.0,657 675,657 675,637" fill="none" stroke="#262626" stroke-width="2" marker-end="url(#ar)"/>
<text x="1153.0" y="705" font-size="10.5" fill="#262626" font-weight="600">chargée au démarrage</text>
</svg>